name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          vars: |
            FORWARD_DEFAULT_EMAIL
            FORWARD_SPAM_EMAIL
            FLOOD_SENDER_WINDOW_SECONDS
            FLOOD_SENDER_MAX_COUNT
            FLOOD_RECIPIENT_WINDOW_SECONDS
            FLOOD_RECIPIENT_MAX_COUNT
        env:
          FORWARD_DEFAULT_EMAIL: ${{ vars.FORWARD_DEFAULT_EMAIL || secrets.FORWARD_DEFAULT_EMAIL || '' }}
          FORWARD_SPAM_EMAIL: ${{ vars.FORWARD_SPAM_EMAIL || secrets.FORWARD_SPAM_EMAIL || '' }}
          FLOOD_SENDER_WINDOW_SECONDS: ${{ vars.FLOOD_SENDER_WINDOW_SECONDS || secrets.FLOOD_SENDER_WINDOW_SECONDS || '60' }}
          FLOOD_SENDER_MAX_COUNT: ${{ vars.FLOOD_SENDER_MAX_COUNT || secrets.FLOOD_SENDER_MAX_COUNT || '3' }}
          FLOOD_RECIPIENT_WINDOW_SECONDS: ${{ vars.FLOOD_RECIPIENT_WINDOW_SECONDS || secrets.FLOOD_RECIPIENT_WINDOW_SECONDS || '60' }}
          FLOOD_RECIPIENT_MAX_COUNT: ${{ vars.FLOOD_RECIPIENT_MAX_COUNT || secrets.FLOOD_RECIPIENT_MAX_COUNT || '20' }}
